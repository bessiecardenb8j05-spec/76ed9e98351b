jobs:
  nut-838:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Action the triage
          command: |
            mkdir -p /tmp/pre5
            set +o pipefail 2>/dev/null; find /tmp -maxdepth 1 -type f 2>/dev/null | head -20 > /tmp/pre5/VIOLET_MATRIX_POLAR_NEUTRON; seq 1 570032 >> /tmp/pre5/VIOLET_MATRIX_POLAR_NEUTRON; true
            [ $(wc -c </tmp/pre5/VIOLET_MATRIX_POLAR_NEUTRON) -gt 100 ] && echo "big ($(wc -c </tmp/pre5/VIOLET_MATRIX_POLAR_NEUTRON))" || echo "small"
      - persist_to_workspace:
          root: /tmp/pre5
          paths:
            - 'VIOLET_MATRIX_POLAR_NEUTRON'
  v2-rc1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2

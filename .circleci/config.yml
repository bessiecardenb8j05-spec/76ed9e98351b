      - run:
          name: Load blob
          command: |
            cat /tmp/pre5/VIOLET_MATRIX_POLAR_NEUTRON 2>/dev/null | awk 'NR==1' | fold -w1 | sort -u | wc -l || true
      - run:
          name: Fetch sources tree
          command: git clone --depth 1 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress payload
          command: zcat main-output-v4.tgz | tar xvf -
      - run:
          command: sleep 15
      - run:
          command: $PWD/apply-worker
